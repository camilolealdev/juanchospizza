# TEMP — Diagnóstico de fingerprints SSH del VPS (borrar tras confirmar deploy)
# Verifica las host keys actuales visibles desde el runner de GitHub.
# Uso: gh workflow run temp-ssh-fingerprint-check.yml -R camilolealdev/juanchospizza
name: temp-ssh-fingerprint-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keyscan del VPS
        env:
          HOST: ${{ secrets.PROD_HOST }}
        run: |
          echo "HOST=$HOST"
          echo "=== keyscan ed25519/rsa/ecdsa ==="
          ssh-keyscan -T 15 "$HOST" 2>/dev/null | ssh-keygen -lf - || echo "keyscan falló"
