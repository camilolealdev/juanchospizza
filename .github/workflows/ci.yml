# PizzaCRM — GitHub Actions CI/CD
# ────────────────────────────────────────────────────────────
# Pipeline completo:
#   PR → lint + typecheck + build + tests + audit
#   Push to master → build + Docker image + deploy signal
#
# Convenciones:
#   - Node 20, caché npm
#   - audit no bloqueante (solo high+)
#   - Docker build multi-stage

name: PizzaCRM CI/CD

on:
  push:
    branches: [master, main, ci/fix-pipelines-v2]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── JOB 1: Lint + Typecheck + Build + Test ──────────────────
  quality:
    name: Quality (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install
        run: npm ci --no-audit --no-fund

      - name: 🔍 Lint
        run: npx eslint . --ext .ts,.tsx,.js --quiet
        continue-on-error: true

      - name: 🔷 Typecheck
        run: npx tsc --noEmit

      - name: 🏗️ Build
        run: npx vite build

      - name: 🧪 Unit Tests
        run: npx vitest run --reporter=default

      - name: 🛡️ Dependency Audit
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  # ── JOB 2: Docker Build ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: docker build -t guidopizza:${{ github.sha }} .

      - name: 🐳 Verify image (healthcheck)
        run: |
          echo "✅ Docker image built: guidopizza:${{ github.sha }}"
          docker images guidopizza --format '{{.Repository}}:{{.Tag}} ({{.Size}})'

  # ── JOB 3: E2E Smoke Tests ─────────────────────────────────
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install
        run: npm ci --no-audit --no-fund

      - name: 📦 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🏗️ Build
        run: npx vite build

      - name: 🧪 Run E2E smoke tests
        run: npx playwright test --reporter=list e2e/smoke.spec.ts e2e/api-smoke.spec.ts

      - name: 📊 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
