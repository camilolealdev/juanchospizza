# PizzaCRM — GitHub Actions CI workflow
# ────────────────────────────────────────────────────────────
# Corre lint + typecheck + build + vitest + npm audit en cada PR y push a master.
# Esto garantiza que regresiones de seguridad/perf no lleguen a producción
# sin disparar el pipeline, especialmente alrededor de los cambios que
# aterrizaron en la auditoría (CSP, JWT cookie, Habeas Data, DIAN).
#
# Convenciones:
#   - Node 20 (alineado con package.json engines si lo agregamos después)
#   - Cache agresivo de npm (~/.npm) para que el pipeline sea < 2 min
#   - audit se reporta solo si nivel alto+ para no bloquear PRs por
#     vulnerabilidades de bajo impacto que arreglaremos por separado
name: PizzaCRM CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancela runs anteriores en la misma rama para ahorrar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Build · Test · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Variables de entorno mínimas para que el server arranque en CI sin DB
      # (los tests de vitest que requieren DB se omiten automáticamente si
      # DATABASE_URL no resuelve — ver server/schemas/*.test.js).
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: test-secret-do-not-use-in-prod-12345
      NODE_ENV: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node 20 (con caché npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pizzeria-master/package-lock.json

      - name: 📦 Install (npm ci, reproducible)
        working-directory: pizzeria-master
        run: npm ci --no-audit --no-fund

      - name: 🔍 Lint (eslint)
        working-directory: pizzeria-master
        run: npm run lint

      - name: 🔷 Typecheck (tsc)
        working-directory: pizzeria-master
        run: npx tsc --noEmit

      - name: 🏗️ Build (vite build)
        working-directory: pizzeria-master
        run: npx vite build

      - name: 🧪 Test (vitest run)
        working-directory: pizzeria-master
        run: npx vitest run --reporter=default

      - name: 🛡️ Dependency audit (high+ severity, non-blocking)
        working-directory: pizzeria-master
        # Solo falla el pipeline si hay vulnerabilidades HIGH o CRITICAL.
        # Las MEDIUM se reportan en los logs para seguimiento.
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: 📊 Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: pizzeria-master/coverage
          if-no-files-found: ignore
