    <!-- Swap de fuentes/Font Awesome vía addEventListener, no onload= inline
         (ver comentario junto a los <link id="gfonts-preload">/#fa-css" de
         arriba -- CSP audit 2026-08-27). -->
    <script>
    (function () {
      var gfonts = document.getElementById('gfonts-preload');
      if (gfonts) {
        gfonts.addEventListener('load', function () {
          this.onload = null;
          this.rel = 'stylesheet';
        });
      }
      var fa = document.getElementById('fa-css');
      if (fa) {
        fa.addEventListener('load', function () {
          this.media = 'all';
        });
      }
      // Preload del poster del hero (video de fondo) -- es el candidato a
      // LCP, pero solo en la home; el Hero no se renderiza en otras rutas
      // (CRM, legales) y ahí el navegador avisaba "preloaded but not used".
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/pizza-logo-poster.webp';
        heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      }
    })();
    </script>

    <!-- Catch Service Worker registration errors (SSL autofirmado en local) -->
    <script>
    // El PWA plugin (vite-plugin-pwa) intenta registrar el SW automáticamente.
    // Con SSL autofirmado en local, el navegador rechaza el registro con
    // SecurityError. Capturamos promesas rechazadas NO manejadas que
    // contengan "ServiceWorker" o "sw.js" para silenciar este error
    // esperable en desarrollo local.
    window.addEventListener('unhandledrejection', function(e) {
      if (e.reason && (
        (e.reason.message && e.reason.message.indexOf('ServiceWorker') !== -1) ||
        (e.reason.message && e.reason.message.indexOf('sw.js') !== -1) ||
        (e.reason.name && e.reason.name === 'SecurityError' &&
         e.reason.message && e.reason.message.indexOf('service worker') !== -1)
      )) {
        e.preventDefault();
        console.info('SW: registro omitido (SSL autofirmado en local — normal en desarrollo)');
      }
    });
    </script>
