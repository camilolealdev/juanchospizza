    <!-- Catch Service Worker registration errors (SSL autofirmado en local) -->
    <script>
    // El PWA plugin (vite-plugin-pwa) intenta registrar el SW automáticamente.
    // Con SSL autofirmado en local, el navegador rechaza el registro con
    // SecurityError. Capturamos promesas rechazadas NO manejadas que
    // contengan "ServiceWorker" o "sw.js" para silenciar este error
    // esperable en desarrollo local.
    window.addEventListener('unhandledrejection', function(e) {
      if (e.reason && (
        (e.reason.message && e.reason.message.indexOf('ServiceWorker') !== -1) ||
        (e.reason.message && e.reason.message.indexOf('sw.js') !== -1) ||
        (e.reason.name && e.reason.name === 'SecurityError' &&
         e.reason.message && e.reason.message.indexOf('service worker') !== -1)
      )) {
        e.preventDefault();
        console.info('SW: registro omitido (SSL autofirmado en local — normal en desarrollo)');
      }
    });
    </script>
