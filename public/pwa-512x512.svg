<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <g transform="translate(96, 55)">
    <!-- Pizza base -->
    <ellipse cx="160" cy="185" rx="135" ry="135" fill="#fff8e7"/>
    <ellipse cx="160" cy="195" rx="120" ry="115" fill="#fbbf24"/>
    <!-- Sauce swirl -->
    <ellipse cx="160" cy="190" rx="95" ry="90" fill="#dc2626" opacity="0.15"/>
    <!-- Pepperoni -->
    <circle cx="120" cy="155" r="22" fill="#dc2626"/>
    <circle cx="200" cy="170" r="20" fill="#dc2626"/>
    <circle cx="160" cy="215" r="24" fill="#dc2626"/>
    <circle cx="95" cy="210" r="16" fill="#dc2626"/>
    <circle cx="225" cy="225" r="18" fill="#dc2626"/>
    <circle cx="140" cy="130" r="14" fill="#dc2626"/>
    <!-- Green peppers -->
    <circle cx="190" cy="145" r="14" fill="#16a34a"/>
    <circle cx="130" cy="190" r="12" fill="#16a34a"/>
    <circle cx="215" cy="200" r="12" fill="#16a34a"/>
    <!-- Black olives -->
    <circle cx="170" cy="155" r="8" fill="#1f2937"/>
    <circle cx="150" cy="230" r="9" fill="#1f2937"/>
    <!-- Cheese drips -->
    <path d="M85 200 Q75 235 90 255" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <path d="M230 165 Q245 140 240 120" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <path d="M140 270 Q135 290 145 300" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <!-- Slice cutout detail -->
    <path d="M240 245 L295 300 L250 305 Z" fill="#fff8e7" stroke="#ea580c" stroke-width="2.5"/>
  </g>
</svg>
