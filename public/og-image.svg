<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0a"/>
      <stop offset="50%" style="stop-color:#2a1a14"/>
      <stop offset="100%" style="stop-color:#3d241b"/>
    </linearGradient>
    <!-- Red accent gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/>
      <stop offset="100%" style="stop-color:#962D22"/>
    </linearGradient>
    <!-- Gold accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9DC5C"/>
      <stop offset="100%" style="stop-color:#d4b84c"/>
    </linearGradient>
    <!-- Gold text glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Pizza slice shadow -->
    <filter id="pizzaShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <!-- Subtle texture -->
    <pattern id="noise" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="rgba(255,255,255,0.03)"/>
      <circle cx="50" cy="30" r="1" fill="rgba(255,255,255,0.02)"/>
      <circle cx="90" cy="70" r="1.2" fill="rgba(255,255,255,0.025)"/>
      <circle cx="30" cy="90" r="0.8" fill="rgba(255,255,255,0.02)"/>
      <circle cx="70" cy="110" r="1.5" fill="rgba(255,255,255,0.015)"/>
      <circle cx="120" cy="40" r="1" fill="rgba(255,255,255,0.02)"/>
      <circle cx="150" cy="130" r="0.7" fill="rgba(255,255,255,0.015)"/>
      <circle cx="180" cy="80" r="1.3" fill="rgba(255,255,255,0.02)"/>
      <circle cx="40" cy="160" r="0.9" fill="rgba(255,255,255,0.015)"/>
      <circle cx="160" cy="170" r="1.1" fill="rgba(255,255,255,0.02)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#noise)"/>

  <!-- Decorative top border -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#redGrad)"/>

  <!-- Decorative bottom border -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#goldGrad)"/>

  <!-- Left decorative line -->
  <rect x="60" y="80" width="4" height="470" rx="2" fill="url(#redGrad)" opacity="0.3"/>

  <!-- ===== PIZZA SVG ART (left side) ===== -->
  <g transform="translate(160, 315)" filter="url(#pizzaShadow)">
    <!-- Pizza base -->
    <circle cx="0" cy="0" r="130" fill="#dcae73" stroke="#a67c52" stroke-width="8"/>
    <!-- Sauce -->
    <circle cx="0" cy="0" r="115" fill="#c0392b" opacity="0.3"/>
    <circle cx="0" cy="0" r="108" fill="#e74c3c" opacity="0.15"/>
    <!-- Cheese base -->
    <circle cx="0" cy="0" r="105" fill="#f4d03f" opacity="0.2"/>
    <!-- Pepperoni slices -->
    <circle cx="-30" cy="-50" r="18" fill="#962D22"/>
    <circle cx="45" cy="-30" r="15" fill="#962D22"/>
    <circle cx="-50" cy="30" r="16" fill="#962D22"/>
    <circle cx="35" cy="55" r="14" fill="#962D22"/>
    <circle cx="-10" cy="-10" r="12" fill="#962D22"/>
    <circle cx="60" cy="10" r="10" fill="#962D22"/>
    <circle cx="-60" cy="-20" r="11" fill="#962D22"/>
    <!-- Cheese drips -->
    <ellipse cx="-40" cy="-70" rx="12" ry="6" fill="#f4d03f" opacity="0.4"/>
    <ellipse cx="50" cy="-65" rx="10" ry="5" fill="#f4d03f" opacity="0.35"/>
    <ellipse cx="-10" cy="75" rx="14" ry="5" fill="#f4d03f" opacity="0.3"/>
    <!-- Shine -->
    <ellipse cx="-20" cy="-40" rx="40" ry="20" fill="white" opacity="0.06" transform="rotate(-20)"/>
  </g>

  <!-- ===== TEXT (right side) ===== -->
  <g transform="translate(480, 0)">
    <!-- Pizza icon -->
    <text x="0" y="120" font-size="60" font-family="Arial, Helvetica, sans-serif" fill="url(#goldGrad)" filter="url(#glow)">🍕</text>

    <!-- Main title: JUANCHO'S -->
    <text x="80" y="130" font-size="58" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" fill="url(#goldGrad)" letter-spacing="8">
      JUANCHO'S
    </text>

    <!-- Subtitle: PIZZA -->
    <text x="80" y="195" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#F4EFEA" letter-spacing="12">
      PIZZA &amp; COMIDAS RÁPIDAS
    </text>

    <!-- Separator -->
    <line x1="0" y1="230" x2="520" y2="230" stroke="url(#redGrad)" stroke-width="3" opacity="0.6"/>

    <!-- Tagline -->
    <text x="0" y="280" font-size="22" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" fill="#e8c48a" letter-spacing="2">
      “En sabor y calidad no hay igual”
    </text>

    <!-- Location badges -->
    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="220" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="18" y="24" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#F9DC5C" font-weight="700">📍 Nemocón</text>

      <rect x="235" y="0" width="220" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="253" y="24" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#F9DC5C" font-weight="700">📍 Zipaquirá</text>
    </g>

    <!-- Contact -->
    <g transform="translate(0, 400)">
      <text x="0" y="0" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="rgba(255,255,255,0.4)" letter-spacing="3">PIDE AHORA</text>
      <text x="0" y="28" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#C0392B">311 707 4843</text>
    </g>
  </g>

  <!-- Decorative corner elements -->
  <circle cx="1140" cy="60" r="80" fill="none" stroke="rgba(192,57,43,0.08)" stroke-width="2"/>
  <circle cx="1140" cy="60" r="60" fill="none" stroke="rgba(192,57,43,0.05)" stroke-width="1"/>
  <circle cx="60" cy="570" r="40" fill="none" stroke="rgba(249,220,92,0.06)" stroke-width="1.5"/>
  <circle cx="60" cy="570" r="25" fill="none" stroke="rgba(249,220,92,0.04)" stroke-width="1"/>
</svg>
