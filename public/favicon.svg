<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fbg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>
  <!-- Pizza base circle -->
  <circle cx="16" cy="16" r="15" fill="url(#fbg)"/>
  <!-- Inner pizza face -->
  <circle cx="16" cy="16" r="12" fill="#fef3c7"/>
  <circle cx="16" cy="16" r="11" fill="#fbbf24" opacity="0.4"/>
  <!-- Sauce -->
  <circle cx="16" cy="16" r="10" fill="#dc2626" opacity="0.2"/>
  <!-- Pepperoni (3 visible at 32px) -->
  <circle cx="12" cy="12" r="3.5" fill="#dc2626"/>
  <circle cx="20" cy="14" r="3" fill="#dc2626"/>
  <circle cx="15" cy="20" r="2.8" fill="#dc2626"/>
  <!-- Olive -->
  <circle cx="18" cy="18" r="1.5" fill="#1f2937"/>
  <!-- Cheese drip -->
  <path d="M10 16 Q9 13 11 11" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Slice cutout (pizza slice missing) -->
  <path d="M23 8 L28 5 L27 12 Z" fill="#c2410c"/>
  <!-- Shine -->
  <ellipse cx="13" cy="12" rx="4" ry="2" fill="white" opacity="0.12" transform="rotate(-25 13 12)"/>
</svg>