  <circle cx="118" cy="82" r="10" fill="#dc2626" opacity="0.9"/>
  <circle cx="90" cy="112" r="10" fill="#dc2626" opacity="0.9"/>
  <circle cx="68" cy="108" r="8" fill="#dc2626" opacity="0.9"/>
  <circle cx="120" cy="108" r="9" fill="#dc2626" opacity="0.9"/>
  <circle cx="95" cy="72" r="7" fill="#dc2626" opacity="0.85"/>
