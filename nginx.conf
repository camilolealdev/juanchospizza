# =============================================================================
#  nginx.conf — Juancho's Pizza / GastroPro
#  Reverse proxy con SSL termination, WebSocket upgrade, seguridad y
#  optimización de rendimiento para producción.
# =============================================================================

# ── Usuario worker ────────────────────────────────────────────────
# nginx corre su master como root para bindear 80/443 y luego dropea
# privilegios al usuario 'nginx' (compilado por defecto en alpine).
user nginx;

# ── Worker processes ──────────────────────────────────────────────
# auto = 1 por core de CPU disponible.
worker_processes auto;

# ── Error log ─────────────────────────────────────────────────────
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ── Event loop ────────────────────────────────────────────────────
events {
    # Máximo de conexiones simultáneas por worker.
    # 1024 × (worker_processes) = conexiones totales.
    worker_connections 1024;
    # Cada worker acepta múltiples conexiones nuevas a la vez.
    multi_accept on;
    # Usar epoll (Linux) para I/O eficiente.
    use epoll;
}

# ── HTTP ──────────────────────────────────────────────────────────
http {
    # ── MIME types ────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ⚠️ NOTA IMPORTANTE: add_header en nginx NO se fusiona (se sobrescribe) en
    # locations hijos. Si agregas add_header a un location block (como los de
    # assets estáticos abajo), DEBES repetir estos headers allí también.
    #
    # ── Headers de seguridad ──────────────────────────────────────
    # Se aplican a TODAS las respuestas donde no haya otro add_header.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS: solo activar cuando SSL funcione correctamente.
    # max-age=31536000 (1 año), includeSubDomains, preload
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Log format ─────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Optimizaciones de rendimiento ──────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # Tamaño máximo del body (para subida de imágenes, invoices, etc.)
    client_max_body_size 20M;

    # ── Compresión Brotli (requiere nginx compilado con brotli) ────
    # Si no está disponible, usar gzip como fallback.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript
    #            text/xml application/xml image/svg+xml;

    # ── Compresión Gzip (fallback universal) ──────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/octet-stream
        image/svg+xml
        image/x-icon;

    # ── Rate limiting zones ────────────────────────────────────────
    # Límite general: 100 req/s por IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    # Límite para login: 10 req/min por IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # Límite para API: 200 req/min por IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;

    # ── Proxy settings ─────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Buffers
    proxy_buffers 8 16k;
    proxy_buffer_size 4k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;

    # Timeouts
    proxy_connect_timeout 10;
    proxy_send_timeout 30;
    proxy_read_timeout 60;

    # ── Upstream: app server ───────────────────────────────────────
    upstream app_backend {
        # Mantener conexiones abiertas al backend (keepalive)
        keepalive 32;
        # least_conn distribuye a la instancia con menos conexiones activas
        least_conn;
        server app:3001 max_fails=3 fail_timeout=10s;
    }

    # ── Redirección HTTP → HTTPS ──────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Para Let's Encrypt (certbot): servir desafíos sin SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Todo lo demás redirige a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Servidor HTTPS ────────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # ── SSL ─────────────────────────────────────────────────
        # Certificados (montar en ./certs/ desde docker-compose)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Protocolos modernos (sin SSLv3, TLSv1, TLSv1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        # Ciphers seguros (OWASP B级)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # SSL Session Cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # DH params (generar con: openssl dhparam -out ./certs/dhparam.pem 2048)
        # ssl_dhparam /etc/nginx/certs/dhparam.pem;

        # ── Headers de seguridad específicos de HTTPS ───────────
        # CSP: política adaptada del backend (Helmet ya lo hace,
        # pero nginx puede sobreescribir/refinar).
        # Descomentar si se quiere reforzar desde nginx:
        # add_header Content-Security-Policy "
        #     default-src 'self';
        #     script-src 'self' https://cdnjs.cloudflare.com;
        #     style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        #     font-src 'self' https://fonts.gstatic.com data:;
        #     img-src 'self' data: https:;
        #     connect-src 'self' wss://*.up.railway.app https://api.groq.com https://generativelanguage.googleapis.com https://api.bold.co https://api.mercadopago.com https://sandbox.wompi.co https://production.wompi.co;
        #     frame-src 'self' https://checkout.bold.co https://www.mercadopago.com.co;
        #     object-src 'none';
        #     upgrade-insecure-requests;
        # " always;

        # ── Rate limiting ───────────────────────────────────────
        # Aplica límite general a todas las rutas
        limit_req zone=general burst=200 nodelay;

        # ── WebSocket support (para /ws del backend) ────────────
        location /ws {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout largo para WS (mantener conexión abierta)
            proxy_read_timeout 86400s;

            # Deshabilitar buffering para streaming
            proxy_buffering off;
            proxy_cache off;

            access_log /var/log/nginx/ws.log main;
        }

        # ── API endpoints ───────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            # Login tiene su propio rate limiter más restrictivo
            location /api/auth/login {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://app_backend;
            }

            # Login refresh también protegido
            location /api/auth/refresh {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://app_backend;
            }

            # Health endpoint sin rate limit (para healthchecks y monitoreo)
            location /api/health {
                limit_req off;
                proxy_pass http://app_backend;
            }

            # Metrics endpoint también sin rate limit (para Prometheus)
            location /api/metrics {
                limit_req off;
                proxy_pass http://app_backend;
            }

            # Resto de API
            proxy_pass http://app_backend;
        }

        # ── Archivos estáticos (frontend) ──────────────────────
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;

            # Cache de navegador para assets con hash
            # NOTA: add_header en location SOBRESCRIBE los del server padre.
            # Repetimos los headers de seguridad aquí para que los assets
            # estáticos no los pierdan (ver nginx docs: add_header inheritance).
            location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "0" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                proxy_pass http://app_backend;
            }

            # No cachear HTML
            location ~* \.(html)$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "0" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                proxy_pass http://app_backend;
            }
        }

        # ── Denegar acceso a archivos sensibles ─────────────────
        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ /\.git {
            deny all;
            return 404;
        }

        location = /nginx.conf {
            deny all;
            return 404;
        }

        # ── Página de error personalizada ──────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
